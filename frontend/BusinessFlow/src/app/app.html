@if (auth.isAuthenticated$ | async) {
  <app-impersonation-banner />
  <div class="app-layout">
    @if (auth.isPlatformUser()) {
      <aside class="app-sidebar" [class.mobile-open]="mobileSidebarOpen()">
        <app-platform-sidebar />
      </aside>
    } @else {
      <aside class="app-sidebar" [class.mobile-open]="mobileSidebarOpen()"
             [class.collapsed]="sidebarCollapsed()">
        <app-sidebar [collapsed]="sidebarCollapsed()" [mobileOpen]="mobileSidebarOpen()" (closeMobile)="closeMobileSidebar()" />
      </aside>
    }

    <div class="app-main">
      <app-navbar (toggleMobileSidebar)="toggleMobileSidebar()" />
      <main class="app-content">
        <router-outlet />
      </main>
    </div>
  </div>
} @else {
  <router-outlet />
}

<div class="toast-container">
  @for (toast of notifications.toasts(); track toast.id) {
    <div class="toast-shadcn toast-shadcn-{{ toast.type }}">
      <div class="toast-body">{{ toast.message }}</div>
      <button class="toast-close" (click)="notifications.dismiss(toast.id)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
  }
</div>
