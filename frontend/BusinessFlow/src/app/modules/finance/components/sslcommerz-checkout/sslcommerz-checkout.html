<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-header py-3">
          <h5 class="mb-0"><i class="bi bi-credit-card me-2"></i>Wallet Top-Up via SSLCommerz</h5>
        </div>
        <div class="card-body">
          @if (error) {
            <div class="alert alert-danger py-2">{{ error }}</div>
          }

          <div class="mb-3">
            <label class="form-label">Amount (BDT)</label>
            <input type="number" class="form-control form-control-lg" [(ngModel)]="amount"
                   min="10" step="10" placeholder="e.g. 500" />
            <small class="text-muted">Minimum 10 BDT</small>
          </div>

          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" [(ngModel)]="cusName" placeholder="Your name" />
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" [(ngModel)]="cusEmail" placeholder="you@example.com" />
          </div>

          <div class="mb-3">
            <label class="form-label">Phone (optional)</label>
            <input type="tel" class="form-control" [(ngModel)]="cusPhone" placeholder="01XXXXXXXXX" />
          </div>

          <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary" (click)="goBack()">Cancel</button>
            <button class="btn btn-primary flex-grow-1" (click)="pay()"
                    [disabled]="processing || amount < 10 || !cusName || !cusEmail">
              @if (processing) {
                <span class="spinner-border spinner-border-sm me-1"></span> Processing...
              } @else {
                Pay {{ amount || 0 | number }} BDT
              }
            </button>
          </div>

          <div class="mt-3 text-center">
            <small class="text-muted">
              <i class="bi bi-shield-lock me-1"></i>Secure payment powered by SSLCommerz (Sandbox)
            </small>
          </div>

          <div class="mt-3 p-2 bg-light rounded small">
            <strong>Sandbox test cards:</strong><br/>
            VISA: <code>4111111111111111</code> Exp: <code>12/26</code> CVV: <code>111</code><br/>
            OTP: <code>111111</code> or <code>123456</code>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
