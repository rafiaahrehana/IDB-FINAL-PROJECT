<section id="pricing" class="py-3 pricing-section position-relative overflow-hidden">

  <div class="container py-5 position-relative z-1">
    <div class="text-center max-w-2xl mx-auto mb-4 slide-up">
      <h2 class="display-5 fw-bold section-title mb-4 slide-up" style="animation-delay: 0.1s;">Pricing that scales with you</h2>
      <p class="text-muted fs-5 mb-4">No hidden fees. Pay only for what your team uses.</p>

      <div class="d-flex flex-wrap justify-content-center gap-4 pt-1">
        <span class="text-muted small fw-medium" *ngFor="let badge of trustBadges">{{ badge }}</span>
      </div>
    </div>

    <div class="row g-4 align-items-stretch justify-content-center pt-4">
      <div class="col-md-6 col-lg-3 slide-up" *ngFor="let plan of plans(); let i = index"
        [style.animation-delay]="(i * 0.1) + 's'">

        <div class="card h-100 rounded-4 p-4 p-xl-4 transition-all pricing-card text-center"
          [ngClass]="plan.highlighted ? 'pricing-card-highlighted shadow position-relative' : 'bg-white border-light shadow-sm'">

          <div *ngIf="plan.highlighted"
            class="position-absolute top-0 start-50 translate-middle badge rounded-pill bg-white text-purple px-3 py-2 fw-semibold shadow-sm">
            Most Popular
          </div>

          <h4 class="fw-bold mb-3 mt-2" [ngClass]="plan.highlighted ? 'text-white' : 'text-dark'">{{ plan.name }}</h4>

          <div class="mb-4">
            <h2 class="display-5 fw-bold mb-1" [ngClass]="plan.highlighted ? 'text-white' : 'text-dark'">{{ plan.price }}</h2>
            <span class="small" [ngClass]="plan.highlighted ? 'text-white-50' : 'text-muted'">{{ plan.period }}</span>
          </div>

          <button [routerLink]="plan.name === 'Enterprise' ? '/contact' : '/auth/register'"
            class="btn w-100 rounded-pill py-2 mb-4 fw-medium" [ngClass]="plan.btnClass">
            {{ plan.btnText }}
          </button>

          <hr class="pricing-divider mb-4" [ngClass]="plan.highlighted ? 'pricing-divider-highlighted' : ''" />

          <ul class="list-unstyled m-0 d-flex flex-column gap-3 text-start small">
            <li *ngFor="let feature of plan.features" class="d-flex align-items-start gap-2">
              <i class="bi bi-check2 fw-bold mt-1" [ngClass]="plan.highlighted ? 'text-white' : 'text-purple'"></i>
              <span [ngClass]="plan.highlighted ? 'text-white' : 'text-dark'">{{ feature }}</span>
            </li>
          </ul>

        </div>
      </div>
    </div>
  </div>
</section>
