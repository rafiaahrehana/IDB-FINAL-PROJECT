<section class="py-7 bg-white security-section">
  <div class="container py-5">
    <!-- Top Centered Text -->
    <div class="row justify-content-center text-center mb-5">
      <div class="col-lg-8 slide-up">
        <span class="fw-bold text-muted text-uppercase small tracking-wide mb-3 d-block">Enterprise Security</span>
        <h2 class="display-5 fw-bold section-title mb-4">Bank-grade security built into every layer</h2>
        <p class="lead text-muted mb-4 fs-6 mx-auto" style="max-width: 600px;">
          Protecting your company's data is our highest priority. We comply with industry standards to ensure that your business operates safely.
        </p>
        <a href="#security" class="fw-semibold text-purple text-decoration-none d-inline-flex align-items-center gap-1">
          Read our Security Whitepaper <i class="bi bi-arrow-right"></i>
        </a>
      </div>
    </div>
      
    <!-- Bottom Grid -->
    <div class="row g-4 justify-content-center">
      <div class="col-md-6 col-lg-4 slide-up" *ngFor="let feat of features(); let i = index" [style.animation-delay]="(i * 0.1) + 's'">
        <div class="security-card d-flex align-items-center gap-3 p-3 rounded-4 bg-lavender-light hover-card-lift">
          <div class="icon-box bg-purple-dark text-lavender rounded-3 d-flex align-items-center justify-content-center flex-shrink-0">
            <i class="bi fs-5" [ngClass]="feat.icon"></i>
          </div>
          <span class="fw-bold text-dark small">{{ feat.title }}</span>
        </div>
      </div>
    </div>
  </div>
</section>
