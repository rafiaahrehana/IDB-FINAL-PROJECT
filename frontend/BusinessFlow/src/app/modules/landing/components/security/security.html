<section class="py-6 bg-white border-bottom">
  <div class="container py-5">
    <div class="row align-items-center">
      <div class="col-lg-5 mb-5 mb-lg-0 slide-up">
        <span class="text-primary-bos fw-bold text-uppercase small tracking-widest mb-2 d-block">Enterprise Security</span>
        <h2 class="display-6 fw-bold text-dark mb-4">Bank-grade security built into every layer</h2>
        <p class="text-muted mb-4">
          Protecting your company's data is our highest priority. We comply with industry standards to ensure that your business operates safely.
        </p>
        <a href="#security" class="text-primary-bos text-decoration-none fw-semibold d-inline-flex align-items-center gap-2">
          Read our Security Whitepaper <i class="bi bi-arrow-right"></i>
        </a>
      </div>
      <div class="col-lg-6 offset-lg-1">
        <div class="row g-4">
          <div class="col-sm-6 slide-up" *ngFor="let feat of features(); let i = index" [style.animation-delay]="(i * 0.1) + 's'">
            <div class="d-flex align-items-center gap-3 p-3 rounded-3 border bg-light-subtle hover-card-lift">
              <div class="bg-white border rounded text-success d-flex align-items-center justify-content-center shadow-sm" style="width: 40px; height: 40px;">
                <i class="bi" [ngClass]="feat.icon"></i>
              </div>
              <span class="fw-bold text-dark">{{ feat.title }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
