<section id="solutions" class="py-6 workflow-section position-relative overflow-hidden bg-white">
  <!-- Wavy Background Decorators -->
  <div class="bg-blob-w blob-left"></div>
  <div class="bg-blob-w blob-right"></div>

  <div class="container py-5 position-relative z-1">
    <div class="row mb-5">
      <div class="col-lg-8 mx-auto text-center">
        <span class="eyebrow-badge mb-3 d-inline-flex slide-up"><span class="eyebrow-dot"></span>Visual Workflow Builder</span>
        <h2 class="display-5 fw-bold section-title mb-4 slide-up" style="animation-delay: 0.1s;">Automate your operations end-to-end</h2>
        <p class="lead text-muted slide-up mx-auto" style="animation-delay: 0.2s; max-width: 600px;">
          Design multi-stage approvals, set conditional routing, and connect external services without writing a single line of code.
        </p>
        <a href="#workflows" class="workflow-cta btn bg-purple-dark text-white rounded-pill px-4 py-2 fw-semibold d-inline-flex align-items-center gap-2 mt-3 slide-up" style="animation-delay: 0.3s;">
          Explore Workflow Templates <i class="bi bi-arrow-up-right"></i>
        </a>

        <div class="carousel-hint d-inline-flex align-items-center gap-2 mt-4 slide-up" style="animation-delay: 0.35s;">
          <span class="carousel-arrow"><i class="bi bi-chevron-left"></i></span>
          <span class="carousel-icon"><i class="bi bi-file-earmark-text"></i></span>
          <span class="carousel-arrow carousel-arrow-active"><i class="bi bi-caret-right-fill"></i></span>
        </div>
      </div>
    </div>

    <div class="workflow-timeline slide-up" style="animation-delay: 0.4s;">
      <div class="d-flex align-items-center justify-content-center flex-nowrap overflow-auto pb-2">

        <!-- Step 1 -->
        <div class="workflow-card step-request text-center flex-shrink-0">
          <div class="card-icon shadow-sm mb-2">
            <i class="bi bi-file-earmark-text fs-5"></i>
          </div>
          <h6 class="fw-bold text-dark mb-0">Request</h6>
        </div>

        <div class="workflow-connector flex-shrink-0"><i class="bi bi-arrow-right"></i></div>

        <!-- Step 2 -->
        <div class="workflow-card step-approval text-center flex-shrink-0">
          <div class="card-icon shadow-sm mb-2">
            <i class="bi bi-check2 fs-5"></i>
          </div>
          <h6 class="fw-bold text-dark mb-0">Approval</h6>
        </div>

        <div class="workflow-connector flex-shrink-0"><i class="bi bi-arrow-right"></i></div>

        <!-- Step 3 -->
        <div class="workflow-card step-task text-center flex-shrink-0">
          <div class="card-icon shadow-sm mb-2">
            <i class="bi bi-list-task fs-5"></i>
          </div>
          <h6 class="fw-bold text-dark mb-0">Task</h6>
        </div>

        <div class="workflow-connector flex-shrink-0"><i class="bi bi-arrow-right"></i></div>

        <!-- Step 4 -->
        <div class="workflow-card step-review text-center flex-shrink-0">
          <div class="card-icon shadow-sm mb-2">
            <i class="bi bi-check2 fs-5"></i>
          </div>
          <h6 class="fw-bold text-dark mb-0">Review</h6>
        </div>

        <div class="workflow-connector flex-shrink-0"><i class="bi bi-arrow-right"></i></div>

        <!-- Step 5 -->
        <div class="workflow-card step-invoice text-center flex-shrink-0">
          <div class="card-icon shadow-sm mb-2">
            <i class="bi bi-receipt fs-5"></i>
          </div>
          <h6 class="fw-bold text-dark mb-0">Invoice</h6>
        </div>

        <div class="workflow-connector flex-shrink-0"><i class="bi bi-arrow-right"></i></div>

        <!-- Step 6 -->
        <div class="workflow-card step-completed text-center flex-shrink-0">
          <div class="card-icon shadow-sm mb-2">
            <i class="bi bi-check2 fs-5"></i>
          </div>
          <h6 class="fw-bold text-dark mb-0">Completed</h6>
        </div>

      </div>
    </div>
  </div>
</section>
