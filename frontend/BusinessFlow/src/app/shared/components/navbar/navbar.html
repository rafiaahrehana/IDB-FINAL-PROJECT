<header class="navbar-shell">
  <div class="navbar-left">
    <button class="navbar-menu-btn" (click)="onToggleMobileSidebar()" aria-label="Toggle sidebar">
      <i class="bi bi-list" style="font-size: 20px;"></i>
    </button>

    <div class="navbar-search-trigger" (click)="showSearch.set(true)">
      <i class="bi bi-search" style="font-size: 14px;"></i>
      <span>Search...</span>
      <kbd>Ctrl+K</kbd>
    </div>
  </div>

  <div class="navbar-right">
    <a class="navbar-icon-btn" routerLink="/ai" title="AI Assistant">
      <i class="bi bi-stars" style="font-size: 18px;"></i>
    </a>

    <app-notification-bell />

    <div class="dropdown-shadcn">
      <button class="navbar-user-btn" (click)="toggleUserMenu()">
        <div class="navbar-avatar">
          {{ getInitials(currentUser?.fullName) }}
        </div>
        <div class="navbar-user-info">
          <span class="navbar-user-name">{{ currentUser?.fullName || 'User' }}</span>
          <span class="navbar-user-role">{{ currentUser?.roles?.[0] || 'User' }}</span>
        </div>
        <i class="bi bi-chevron-down" style="font-size: 14px;"></i>
      </button>

      @if (showUserMenu()) {
        <div class="dropdown-menu" (mouseleave)="closeUserMenu()">
          <div class="dropdown-header">
            <div class="dropdown-header-name">{{ currentUser?.fullName || 'User' }}</div>
            <div class="dropdown-header-email">{{ currentUser?.email || '' }}</div>
          </div>
          <div class="dropdown-separator"></div>
          <a class="dropdown-item" routerLink="/dashboard" (click)="closeUserMenu()">
            <i class="bi bi-grid" style="font-size: 16px;"></i>
            <span>Dashboard</span>
          </a>
          <a class="dropdown-item" routerLink="/notifications/preferences" (click)="closeUserMenu()">
            <i class="bi bi-gear" style="font-size: 16px;"></i>
            <span>Settings</span>
          </a>
          <div class="dropdown-separator"></div>
          <button class="dropdown-item dropdown-item-destructive" (click)="onLogout()">
            <i class="bi bi-box-arrow-right" style="font-size: 16px;"></i>
            <span>Log out</span>
          </button>
        </div>
      }
    </div>
  </div>
</header>

@if (showSearch()) {
  <div class="search-overlay" (click)="showSearch.set(false)">
    <div class="search-dialog" (click)="$event.stopPropagation()">
      <div class="search-input-wrapper">
        <i class="bi bi-search" style="font-size: 18px;"></i>
        <input type="text"
               class="search-input"
               placeholder="Search leads, accounts, tickets..."
               [(ngModel)]="searchQuery"
               (keyup.enter)="onSearch()"
               (keyup.escape)="showSearch.set(false)"
               autofocus />
        <button class="search-close-btn" (click)="showSearch.set(false)">
          <kbd>Esc</kbd>
        </button>
      </div>
      <div class="search-actions">
        <button class="search-action-btn" (click)="onSearch()">
          <i class="bi bi-search" style="font-size: 14px;"></i>
          Search
        </button>
        <button class="search-action-btn search-action-ai" (click)="onSearchAi()">
          <i class="bi bi-stars" style="font-size: 14px;"></i>
          Ask AI
        </button>
      </div>
    </div>
  </div>
}
