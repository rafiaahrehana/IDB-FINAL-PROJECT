<div class="sidebar-wrapper sidebar-scroll h-100 py-3">
  
  <ul class="nav flex-column mb-4">
    <li class="nav-item">
      <a class="sidebar-link" routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
        <i class="bi bi-grid-1x2"></i>Dashboard
      </a>
    </li>

    @for (group of visibleGroups; track group.label) {
      <div class="sidebar-group-header px-4 mt-4 mb-2 text-uppercase fw-bold">{{ group.label }}</div>
      @for (item of group.items; track item.link) {
        <a class="sidebar-link" [routerLink]="item.link" routerLinkActive="active">
          <i class="bi {{ item.icon }}"></i>{{ item.label }}
        </a>
      }
    }
  </ul>
</div>
